apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: events
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: replicated
  components:
    engine:
      replicas: 2
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
      storage:
        size: 50Gi
    keeper:
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
      storage:
        size: 10Gi
