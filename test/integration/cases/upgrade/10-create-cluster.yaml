apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-upgrade
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  version: "26.3"
  topology:
    type: standalone
  components:
    engine:
      type: clickhouse
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2G
      storage:
        size: 10Gi
