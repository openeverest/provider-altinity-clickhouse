# Keeper is provisioned, then the CHI is reapplied with two replicas wired
# to it.
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: itest-ch-topology-keeper
  namespace: default
status:
  status: Completed
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-topology
  namespace: default
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 2
    zookeeper:
      keeper:
        name: itest-ch-topology-keeper
status:
  status: Completed
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-topology
  namespace: default
status:
  phase: Ready
