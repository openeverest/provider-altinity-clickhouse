apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-topology
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: standalone
  components:
    engine:
      type: clickhouse
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 10Gi
