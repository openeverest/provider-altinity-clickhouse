apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-topology
  namespace: default
spec:
  topology:
    type: replicated
  components:
    engine:
      replicas: 2
    keeper:
      type: clickhouse-keeper
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      storage:
        size: 5Gi
