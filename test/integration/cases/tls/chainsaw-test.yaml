apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tls
spec:
  description: |
    Provision a standalone ClickHouse Instance with TLS enabled and assert the
    provider drives cert-manager to issue a server certificate and wires the
    secure ports (HTTPS 8443, native 9440) and certificate files into the CHI
    additively alongside the plaintext ports. Requires cert-manager in the
    cluster (installed by the dev stack).
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,chi,secret,certificate,issuer -o yaml
    - script:
        content: kubectl logs -l app.kubernetes.io/name=provider-altinity-clickhouse -A --tail=100
  steps:
    - name: provision-and-assert
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - instance
              - itest-ch-tls
              - -n
              - default
              - --ignore-not-found
              - --wait=false
