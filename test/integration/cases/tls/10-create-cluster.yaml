# Replicated, so distributed queries between the replicas run over TLS too.
# Without an issuer or a certificate Secret, the provider creates a CA.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-tls
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: replicated
  parameters:
    tls:
      mode: requireTLS
      additionalNames:
        - itest-ch-tls.company.com
  components:
    engine:
      type: clickhouse
      replicas: 2
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 10Gi
    keeper:
      type: clickhouse-keeper
      storage:
        size: 5Gi
