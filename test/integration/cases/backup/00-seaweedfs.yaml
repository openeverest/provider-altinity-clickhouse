# In-cluster S3 for the backup case: SeaweedFS (as the other providers' tests
# use) serving https://seaweedfs.seaweedfs.svc with a certificate cert-manager
# issues, so no key is committed. BackupStorage sets verifyTLS: false.
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: seaweedfs-selfsigned
  namespace: seaweedfs
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  secretName: seaweedfs-cert
  commonName: seaweedfs.seaweedfs.svc
  dnsNames:
    - seaweedfs.seaweedfs.svc
    - seaweedfs.seaweedfs.svc.cluster.local
  issuerRef:
    name: seaweedfs-selfsigned
    kind: Issuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: seaweedfs
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args:
            - mini
            - -dir=/data
            - -s3.cert.file=/etc/seaweedfs/certs/tls.crt
            - -s3.key.file=/etc/seaweedfs/certs/tls.key
            - -webdav=false
            - -admin.ui=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
          env:
            - name: S3_BUCKET
              value: clickhouse-backups
            - name: AWS_ACCESS_KEY_ID
              value: seaweedfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfsadmin
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
              scheme: HTTPS
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /etc/seaweedfs/certs
              name: cert
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: cert
          secret:
            secretName: seaweedfs-cert
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - port: 443
      targetPort: s3
