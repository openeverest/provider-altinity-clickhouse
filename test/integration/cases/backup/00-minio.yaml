apiVersion: v1
kind: Secret
metadata:
  name: itest-backup-credentials
  namespace: default
  labels:
    app: minio
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: itest-backup-storage
  namespace: default
  labels:
    app: minio
spec:
  type: s3
  s3:
    bucket: clickhouse-backups
    region: us-east-1
    endpointURL: http://minio:9000
    forcePathStyle: true
    verifyTLS: false
    credentialsSecretRef:
      name: itest-backup-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: default
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-02T17-50-41Z
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: default
  labels:
    app: minio
spec:
  template:
    metadata:
      labels:
        app: minio
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-10-29T15-34-59Z
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set minio http://minio:9000 minioadmin minioadmin; do
                echo "waiting for minio..."
                sleep 1
              done
              mc mb minio/clickhouse-backups --ignore-existing
  backoffLimit: 10
