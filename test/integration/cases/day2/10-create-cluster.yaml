apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-day2
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: replicated
  components:
    engine:
      type: clickhouse
      replicas: 2
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 10Gi
    keeper:
      type: clickhouse-keeper
      storage:
        size: 5Gi
