# Core matches the class to the provider: ClickHouse serves metrics natively,
# so binding it restarts nothing.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: metrics-it
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (providers[?name == 'altinity-clickhouse'] | [0]):
    mode: ExtensionManaged
    disruption: None
