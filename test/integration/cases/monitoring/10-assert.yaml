# The CHI converges and bakes the native Prometheus endpoint into its settings.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-monitoring
  namespace: default
spec:
  configuration:
    settings:
      prometheus/endpoint: /metrics
      prometheus/port: "9363"
status:
  status: Completed
---
# Core creates the binding; no extension runs here, so it stays unconfigured.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringBinding
metadata:
  namespace: default
  labels:
    core.openeverest.io/instance: itest-ch-monitoring
    monitoring.openeverest.io/entry: metrics
spec:
  destinationRef:
    name: metrics-it
  classRef:
    name: metrics-it
  executionMode: ExtensionManaged
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
---
# The provider publishes the engine's native endpoint for the extension.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-monitoring
  namespace: default
status:
  phase: Ready
  monitoring:
    (destinations[?name == 'metrics'] | [0]):
      mode: ExtensionManaged
    sources:
      metrics:
        - component: engine
          kind: clickhouse
          podSelector:
            core.openeverest.io/instance: itest-ch-monitoring
            core.openeverest.io/component: engine
          port: metrics
          path: /metrics
          scheme: http
