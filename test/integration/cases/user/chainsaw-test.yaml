apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user
spec:
  description: |
    Provision a standalone ClickHouse Instance and assert the provider creates
    the application `admin` user: a credentials Secret holding the username,
    plaintext password and its SHA256 digest, and a CHI that references that
    digest from its users configuration.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,chi,secret -o yaml
    - script:
        content: kubectl logs -n default -l app.kubernetes.io/name=provider-altinity-clickhouse --tail=100
  steps:
    - name: provision-and-assert
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - instance
              - itest-ch-user
              - -n
              - default
              - --ignore-not-found
              - --wait=false
