# The credentials Secret holds the seeded administrative user, the derived
# digest, and the generated credentials for the `default` user, replication
# fetches and the cluster secret.
apiVersion: v1
kind: Secret
metadata:
  name: itest-ch-user-credentials
  namespace: default
type: Opaque
data:
  username: ZGJh # base64("dba")
  password: c2VlZGVkLXBhc3N3b3JkLTAxMjM= # base64("seeded-password-0123")
(length(base64_decode(data.password_sha256_hex))): 64
(length(base64_decode(data.default_password_sha256_hex))): 64
(data.default_password != null): true
(data.interserver_password != null): true
(data.cluster_secret != null): true
---
# Every password is referenced from the Secret by digest or environment
# variable, so no plaintext lands in the ClickHouse configuration.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-user
  namespace: default
spec:
  configuration:
    users:
      dba/access_management: "1"
      dba/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: itest-ch-user-credentials
            key: password_sha256_hex
      default/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: itest-ch-user-credentials
            key: default_password_sha256_hex
    settings:
      interserver_http_credentials/user: interserver
    clusters:
      - secret:
          valueFrom:
            secretKeyRef:
              name: itest-ch-user-credentials
              key: cluster_secret
status:
  status: Completed
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-user
  namespace: default
status:
  phase: Ready
