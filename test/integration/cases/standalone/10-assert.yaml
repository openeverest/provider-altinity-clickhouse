apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-standalone
  namespace: default
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 1
    settings:
      max_concurrent_queries: "200"
      max_connections: "4096"
  templates:
    podTemplates:
      - metadata:
          labels:
            core.openeverest.io/component: engine
            core.openeverest.io/instance: itest-ch-standalone
            core.openeverest.io/provider: altinity-clickhouse
status:
  status: Completed
