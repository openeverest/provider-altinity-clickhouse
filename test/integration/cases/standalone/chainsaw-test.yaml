apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: standalone
spec:
  description: |
    Provision a standalone (single-replica) ClickHouse Instance and assert the
    CHI converges to Completed with custom engine settings, and that no Keeper
    is provisioned.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,chi,chk -o yaml
    - script:
        content: kubectl logs -l app.kubernetes.io/name=provider-altinity-clickhouse -A --tail=100
  steps:
    - name: provision-and-assert
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
        - error:
            file: 10-error-keeper-absent.yaml
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - instance
              - itest-ch-standalone
              - -n
              - default
              - --ignore-not-found
              - --wait=false
