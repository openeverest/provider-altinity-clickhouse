apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: standalone
spec:
  description: |
    Provision a standalone (single-replica) ClickHouse Instance and assert the
    CHI converges to Completed with custom engine settings, and that no Keeper
    is provisioned. Then change the memory limit and assert the Instance
    reports Updating while the pod rolls and Ready afterwards.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,chi,chk -o yaml
    - script:
        content: kubectl logs -n default -l app.kubernetes.io/name=provider-altinity-clickhouse --tail=100
  steps:
    - name: provision-and-assert
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
        - error:
            file: 10-error-keeper-absent.yaml
        # Update the running cluster: Updating while the pod rolls, then Ready.
        - patch:
            file: 20-update.yaml
        - assert:
            file: 20-assert-updating.yaml
        - assert:
            file: 20-assert-ready.yaml
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - instances.core.openeverest.io
              - itest-ch-standalone
              - -n
              - default
              - --ignore-not-found
              - --wait=false
        # Volumes are retained by default (storageReclaimPolicy: Retain); drop
        # them so re-runs on the same cluster start from empty storage.
        - command:
            entrypoint: kubectl
            args:
              - delete
              - pvc
              - -n
              - default
              - -l
              - clickhouse.altinity.com/chi=itest-ch-standalone
              - --ignore-not-found
              - --wait=false
