# Two shards of one replica: scale-out without replication, the smallest
# sharded cluster. The CI cluster is a single node: request less than the
# limits.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-sharding
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: replicated
    parameters:
      numShards: 2
  components:
    engine:
      type: clickhouse
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 10Gi
    keeper:
      type: clickhouse-keeper
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      storage:
        size: 5Gi
