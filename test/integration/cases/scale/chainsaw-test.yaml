apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: scale
spec:
  description: |
    Scale a replicated Instance from 2 to 3 replicas (the new replica gets the
    tables and their rows), back to 2 (with the default Retain policy the
    removed replica keeps its volume and its Keeper metadata, and writes
    continue), and to 3 again (the replica rejoins and catches up).
  timeouts:
    exec: 30m
    cleanup: 5m
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,chi,chk,pods,pvc -o wide
    - script:
        content: kubectl logs -n default -l app.kubernetes.io/name=provider-altinity-clickhouse --tail=100
    - script:
        content: |
          for pod in $(kubectl get pods -n default -l clickhouse.altinity.com/chi=itest-ch-scale -o name); do
            echo "===== $pod"
            kubectl describe -n default "$pod" | sed -n '/^Events:/,$p' || true
            kubectl logs -n default "$pod" -c clickhouse --tail=80 || true
          done
  steps:
    - name: scale
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
        - script:
            content: sh ./scale.sh
      finally:
        - command:
            entrypoint: kubectl
            args: [delete, instances.core.openeverest.io, itest-ch-scale, -n, default, --ignore-not-found, --wait=false]
        # Volumes are retained by default; drop them so re-runs start empty.
        - command:
            entrypoint: kubectl
            args: [delete, pvc, -n, default, -l, clickhouse.altinity.com/chi=itest-ch-scale, --ignore-not-found, --wait=false]
        - command:
            entrypoint: kubectl
            args: [delete, pvc, -n, default, -l, clickhouse-keeper.altinity.com/chk=itest-ch-scale-keeper, --ignore-not-found, --wait=false]
