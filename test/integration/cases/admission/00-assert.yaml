apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-altinity-clickhouse
  namespace: default
status:
  readyReplicas: 1
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: provider-altinity-clickhouse.openeverest.io
webhooks:
  - name: instances.altinity-clickhouse.openeverest.io
    failurePolicy: Ignore
