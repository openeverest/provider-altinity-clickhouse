# Adds a CPU limit below ClickHouse's minimum to the stored replicas error.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-admission
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: standalone
  components:
    engine:
      type: clickhouse
      replicas: 2
      resources:
        limits:
          cpu: 500m
          memory: 2G
      storage:
        size: 10Gi
