apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-admission
  namespace: default
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 1
  templates:
    podTemplates:
      - spec:
          containers:
            - name: clickhouse
              resources:
                limits:
                  memory: 2Gi
status:
  status: Completed
