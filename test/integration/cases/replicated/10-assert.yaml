apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: itest-ch-replicated-keeper
  namespace: default
spec:
  templates:
    podTemplates:
      - spec:
          # Default preferred anti-affinity spreads the Keeper pods.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        clickhouse-keeper.altinity.com/chk: itest-ch-replicated-keeper
                - weight: 50
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    labelSelector:
                      matchLabels:
                        clickhouse-keeper.altinity.com/chk: itest-ch-replicated-keeper
    volumeClaimTemplates:
      # Keeper volumes follow the engine's (default) reclaim policy.
      - reclaimPolicy: Retain
status:
  status: Completed
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-replicated
  namespace: default
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 2
    # ClickHouse references the Keeper CR; the operator resolves it to the
    # Keeper hosts' ready-only client Services.
    zookeeper:
      keeper:
        name: itest-ch-replicated-keeper
    settings:
      max_concurrent_queries: "200"
      max_connections: "4096"
  templates:
    podTemplates:
      - metadata:
          labels:
            core.openeverest.io/component: engine
            core.openeverest.io/instance: itest-ch-replicated
            core.openeverest.io/provider: altinity-clickhouse
        spec:
          # Default preferred anti-affinity spreads the replicas.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        core.openeverest.io/component: engine
                        core.openeverest.io/instance: itest-ch-replicated
                        core.openeverest.io/provider: altinity-clickhouse
                - weight: 50
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    labelSelector:
                      matchLabels:
                        core.openeverest.io/component: engine
                        core.openeverest.io/instance: itest-ch-replicated
                        core.openeverest.io/provider: altinity-clickhouse
    volumeClaimTemplates:
      - reclaimPolicy: Retain
status:
  status: Completed
