apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: expose
spec:
  description: |
    Provision a standalone ClickHouse Instance with a LoadBalancer Service and
    assert the operator creates the root Service with the requested type,
    annotations, and load balancer source ranges, and that the connection
    details report the load balancer address. Switching to a NodePort Service
    reports the node ports instead.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,chi,svc -o yaml
    - script:
        content: kubectl logs -n default -l app.kubernetes.io/name=provider-altinity-clickhouse --tail=100
  steps:
    - name: provision-and-assert
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
        - script:
            content: sh ./connection-check.sh loadbalancer
        - patch:
            file: 20-nodeport.yaml
        - script:
            content: sh ./connection-check.sh nodeport
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - instance
              - itest-ch-expose
              - -n
              - default
              - --ignore-not-found
              - --wait=false
        # Volumes are retained by default (storageReclaimPolicy: Retain); drop
        # them so re-runs on the same cluster start from empty storage.
        - command:
            entrypoint: kubectl
            args:
              - delete
              - pvc
              - -n
              - default
              - -l
              - clickhouse.altinity.com/chi=itest-ch-expose
              - --ignore-not-found
              - --wait=false
