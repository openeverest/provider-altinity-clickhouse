apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-preset
  namespace: default
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 1
  templates:
    podTemplates:
      - spec:
          containers:
            - name: clickhouse
              resources:
                limits:
                  cpu: "1"
                  memory: 4Gi
status:
  status: Completed
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-preset
  namespace: default
  annotations:
    openeverest.io/cluster-instance-preset: clickhouse-standalone
status:
  phase: Ready
