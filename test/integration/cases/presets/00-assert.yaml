apiVersion: core.openeverest.io/v1alpha1
kind: ClusterInstancePreset
metadata:
  name: clickhouse-standalone
  labels:
    app.kubernetes.io/component: preset
spec:
  providerRef:
    name: altinity-clickhouse
  version: "26.8"
  topology:
    type: standalone
  components:
    engine:
      replicas: 1
---
apiVersion: core.openeverest.io/v1alpha1
kind: ClusterInstancePreset
metadata:
  name: clickhouse-replicated
  labels:
    app.kubernetes.io/component: preset
spec:
  providerRef:
    name: altinity-clickhouse
  version: "26.8"
  topology:
    type: replicated
  components:
    engine:
      replicas: 2
    keeper:
      storage:
        size: 10Gi
