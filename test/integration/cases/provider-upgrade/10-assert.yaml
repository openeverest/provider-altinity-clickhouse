apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-provider-upgrade
  namespace: default
# Also asserted on the published release, which may still write a phase of
# the earlier status format: both write the Ready condition.
status:
  (conditions[?type == 'Ready'].status | [0]): "True"
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: itest-ch-provider-upgrade
  namespace: default
status:
  status: Completed
---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: itest-ch-provider-upgrade-keeper
  namespace: default
status:
  status: Completed
