# Provider identity and component definitions.
# This file defines the provider name and maps logical component names
# to their component types (defined in versions.yaml).

name: provider-altinity-clickhouse

components:
  engine:
    type: clickhouse
    parametersSchema: ClickHouseParameters
  keeper:
    type: clickhouse-keeper

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes.
# Version catalogs stay in versions.yaml.
componentTypes:
  clickhouse:
    kind: clickhouse
