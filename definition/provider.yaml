# Provider identity and component definitions.
# This file defines the provider name and maps logical component names
# to their component types (defined in versions.yaml).

name: provider-altinity-clickhouse

components:
  engine:
    type: clickhouse
    parametersSchema: ClickHouseParameters
  keeper:
    type: clickhouse-keeper

# Instances can be suspended (spec.suspend.suspended): the provider stops
# ClickHouse and Keeper and keeps their volumes. Published as
# Provider.spec.suspend.
suspend: {}
