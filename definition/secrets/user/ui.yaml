# UI rendering hints for the user secret (spec.userSecretRef).
label: ClickHouse admin credentials
components:
  username:
    uiType: text
    fieldParams:
      label: Username
      placeholder: admin
  password:
    uiType: text
    fieldParams:
      label: Password
      type: password
    validation:
      required: true
      minLength: 12
componentsOrder:
  - username
  - password
