# Create form of the admin credentials Secret (spec.userSecretRef). Each
# component's path is a key of the Secret's data, the keys the provider reads
# (see types.go); the rules mirror the provider's own checks.
label: ClickHouse admin credentials
components:
  username:
    uiType: text
    path: username
    fieldParams:
      label: Username
      placeholder: admin
      helperText: Leave empty for "admin".
    validation:
      regex:
        pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
        message: Start with a letter or underscore; use only letters, digits and underscores (at most 64)
  password:
    uiType: text
    path: password
    fieldParams:
      label: Password
      type: password
      helperText: At least 12 characters.
    validation:
      required: true
      min: 12
componentsOrder:
  - username
  - password
