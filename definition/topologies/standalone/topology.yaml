# Standalone topology: single-node ClickHouse instance.
# No replication, no ZooKeeper/Keeper required.
# Suitable for development, analytics workloads, and non-HA production.

config:
  components:
    engine: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the ClickHouse version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "ClickHouse Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            helperText: "Upgrades are applied as a rolling restart. Downgrades are rejected."
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure compute resources and storage for the ClickHouse instance."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: "CPU"
                defaultValue: 1
                step: 1
              validation:
                required: true
                min: 1
            memory:
              uiType: number
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 4
                step: 1
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                min: 1
            disk:
              uiType: number
              path: spec.components.engine.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 25
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                int: true
                min: 1
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    # dbaas: form cho khách chỉ giữ version, tài nguyên và TLS. Monitoring, StorageClass, chính sách giữ dữ
    # liệu, kiểu Service và config tự do là việc của platform: bỏ khỏi form, provider dùng mặc định
    # (không PodMonitor, StorageClass mặc định, Retain, ClusterIP, không config thêm).
    security:
      label: "Security"
      description: "Encrypt client connections."
      components:
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "TLS"
            helperText: "Clients connect over HTTPS (8443) and native TLS (9440) only."
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"
      componentsOrder:
        - tls

  sectionsOrder:
    - databaseVersion
    - resources
    - security
