# Standalone topology: single-node ClickHouse instance.
# No replication, no ZooKeeper/Keeper required.
# Suitable for development, analytics workloads, and non-HA production.

config:
  components:
    engine: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the ClickHouse version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "ClickHouse Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure compute resources and storage for the ClickHouse instance."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: "CPU"
                defaultValue: 1
                step: 1
              validation:
                required: true
                min: 1
            memory:
              uiType: number
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 4
                step: 1
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                min: 1
            disk:
              uiType: number
              path: spec.components.engine.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 25
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                int: true
                min: 1
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    monitoring:
      label: "Monitoring"
      description: "Create a Prometheus PodMonitor to scrape ClickHouse metrics. The metrics endpoint is always exposed, so other tools can scrape it even when disabled."
      components:
        podMonitor:
          uiType: select
          path: spec.components.engine.parameters.podMonitor
          fieldParams:
            label: "Prometheus PodMonitor"
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"

    advanced:
      label: "Advanced"
      description: "Optional advanced settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            displayEmpty: true
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "TLS"
            helperText: "Encrypt client connections. Requires cert-manager in the cluster."
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "ClickHouse configuration"
            placeholder: |2
              max_concurrent_queries: 200
              logger/level: information
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - externalAccess
        - tls
        - configuration

  sectionsOrder:
    - databaseVersion
    - resources
    - monitoring
    - advanced
