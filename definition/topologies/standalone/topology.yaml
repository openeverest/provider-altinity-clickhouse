# Standalone topology: single-node ClickHouse instance.
# No replication, no ZooKeeper/Keeper required.
# Suitable for development, analytics workloads, and non-HA production.

config:
  components:
    engine: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the ClickHouse version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "ClickHouse Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            helperText: "Upgrades are applied as a rolling restart. Downgrades are rejected."
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure compute resources and storage for the ClickHouse instance."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: quantity
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: "CPU"
                unitLabel: "CPU"
                defaultValue: 1
              validation:
                required: true
                min: 1
            memory:
              uiType: quantity
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 4
                unit: "Gi"
              validation:
                required: true
                min: 1
            disk:
              uiType: quantity
              path: spec.components.engine.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 25
                unit: "Gi"
              validation:
                required: true
                int: true
                min: 1
                modes:
                  edit:
                    celExpressions:
                      # double(): the rule holds whether the value reaches CEL as a
                      # number or as a string ("10").
                      - celExpr: "double(spec.components.engine.storage.size) >= double(original.spec.components.engine.storage.size)"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    advanced:
      label: "Advanced"
      description: "Optional advanced settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            displayEmpty: true
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        storageReclaimPolicy:
          uiType: select
          path: spec.components.engine.parameters.storageReclaimPolicy
          fieldParams:
            label: "Data on deletion"
            helperText: "Whether the ClickHouse data volume are kept or deleted when the instance is deleted or a replica is removed. Kept volumes are re-attached to a new instance with the same name and namespace."
            defaultValue: "Retain"
            options:
              - label: "Keep (Retain)"
                value: "Retain"
              - label: "Delete"
                value: "Delete"
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "TLS"
            helperText: "Encrypt client connections. Requires cert-manager in the cluster."
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"
        tlsMode:
          uiType: select
          path: spec.components.engine.parameters.tls.mode
          fieldParams:
            label: "TLS mode"
            helperText: "Applies with TLS enabled. Required serves clients over TLS only and blocks the plaintext ports to other pods; Optional keeps them open too."
            defaultValue: "required"
            options:
              - label: "Required"
                value: "required"
              - label: "Optional"
                value: "optional"
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "ClickHouse configuration"
            placeholder: |2
              max_concurrent_queries: 200
              logger/level: information
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - storageReclaimPolicy
        - externalAccess
        - tls
        - tlsMode
        - configuration

  sectionsOrder:
    - databaseVersion
    - resources
    - advanced
