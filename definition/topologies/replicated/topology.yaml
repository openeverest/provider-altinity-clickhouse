# Replicated topology: multi-replica ClickHouse with ClickHouse Keeper.
# ClickHouse Keeper (3 nodes, Raft quorum) replaces ZooKeeper — no external dependency.
# Suitable for production workloads requiring high availability.
#
# Resources:
#   engine   - ClickHouse replicas (configurable count, default 2)
#   keeper   - 3 Keeper nodes, always provisioned; resources and storage configurable

config:
  components:
    engine: {}
    keeper: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the ClickHouse version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "ClickHouse Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            helperText: "Upgrades are applied as a rolling restart. Downgrades are rejected."
          validation:
            required: true

    scaling:
      label: "Scaling"
      description: "Number of ClickHouse replicas. Minimum 2 for HA."
      components:
        replicas:
          uiType: number
          path: spec.components.engine.replicas
          fieldParams:
            label: "Replicas"
            defaultValue: 2
            step: 1
            modes:
              edit:
                disabled: true
          validation:
            required: true
            min: 2

    resources:
      label: "Resources"
      description: "Compute resources and storage per ClickHouse replica."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: "CPU"
                defaultValue: 2
                step: 1
              validation:
                required: true
                min: 1
            memory:
              uiType: number
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 8
                step: 1
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                min: 2
            disk:
              uiType: number
              path: spec.components.engine.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 50
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                int: true
                min: 10
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    keeper:
      label: "ClickHouse Keeper"
      description: "Resources and storage per Keeper node. The replicated topology always runs 3 Keeper nodes."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.components.keeper.resources.limits.cpu
              fieldParams:
                label: "CPU"
                defaultValue: 0.5
                step: 0.5
              validation:
                required: true
                min: 0.5
            memory:
              uiType: number
              path: spec.components.keeper.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 1
                step: 1
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                min: 1
            disk:
              uiType: number
              path: spec.components.keeper.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 10
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                int: true
                min: 5
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "spec.components.keeper.storage.size >= original.spec.components.keeper.storage.size"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    monitoring:
      label: "Monitoring"
      description: "Create a Prometheus PodMonitor to scrape ClickHouse metrics. The metrics endpoint is always exposed, so other tools can scrape it even when disabled."
      components:
        podMonitor:
          uiType: select
          path: spec.components.engine.parameters.podMonitor
          fieldParams:
            label: "Prometheus PodMonitor"
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"

    advanced:
      label: "Advanced"
      description: "Optional advanced settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            displayEmpty: true
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        storageReclaimPolicy:
          uiType: select
          path: spec.components.engine.parameters.storageReclaimPolicy
          fieldParams:
            label: "Data on deletion"
            helperText: "Whether the ClickHouse and Keeper data volumes are kept or deleted when the instance is deleted or a replica is removed. Kept volumes are re-attached to a new instance with the same name and namespace."
            defaultValue: "Retain"
            options:
              - label: "Keep (Retain)"
                value: "Retain"
              - label: "Delete"
                value: "Delete"
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "TLS"
            helperText: "Encrypt client connections. Requires cert-manager in the cluster."
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "ClickHouse configuration"
            placeholder: |2
              max_concurrent_queries: 200
              logger/level: information
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - storageReclaimPolicy
        - externalAccess
        - tls
        - configuration

  sectionsOrder:
    - databaseVersion
    - scaling
    - resources
    - keeper
    - monitoring
    - advanced
