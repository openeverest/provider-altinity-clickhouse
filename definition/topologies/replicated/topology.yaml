# Replicated topology: ClickHouse shards, each with one or more replicas,
# coordinated by ClickHouse Keeper (3 nodes, Raft quorum), so no ZooKeeper.
# Suitable for production workloads requiring high availability or scale-out.
#
# Resources:
#   engine   - ClickHouse replicas per shard (default 2; at least 2 with a single shard)
#   keeper   - 3 Keeper nodes, always provisioned; resources and storage configurable
#
# Parameters:
#   numShards - number of shards (default 1); can grow, never shrink

config:
  parametersSchema: ReplicatedTopologyParameters
  components:
    engine: {}
    keeper: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the ClickHouse version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "ClickHouse Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            helperText: "Upgrades are applied as a rolling restart. Downgrades are rejected."
          validation:
            required: true

    scaling:
      label: "Scaling"
      description: "Shards split the data; each shard runs the same number of replicas, which copy its data. Shards can be added later, not removed, and existing data is not moved onto new shards."
      components:
        shards:
          uiType: number
          path: spec.topology.parameters.numShards
          fieldParams:
            label: "Shards"
            defaultValue: 1
            # An instance created before sharding has no numShards, and the
            # edit form only shows stored values: the placeholder shows its 1.
            placeholder: "1"
            step: 1
            helperText: "Spread the data over the shards with a Distributed table."
          validation:
            required: true
            int: true
            min: 1
            modes:
              edit:
                celExpressions:
                  # An instance created before sharding has no numShards: it
                  # is a single shard, and any value is an increase. double():
                  # a dialog for another section passes the raw string.
                  - celExpr: "!has(original.spec.topology.parameters) || !has(original.spec.topology.parameters.numShards) || double(spec.topology.parameters.numShards) >= double(original.spec.topology.parameters.numShards)"
                    message: "Shards cannot be removed"
        replicas:
          uiType: number
          path: spec.components.engine.replicas
          fieldParams:
            label: "Replicas per shard"
            defaultValue: 2
            step: 1
            helperText: "At least 2 with a single shard. With 1 replica per shard, a lost node makes its shard's data unavailable."
            modes:
              edit:
                disabled: true
          validation:
            required: true
            int: true
            min: 1
            celExpressions:
              - celExpr: "double(spec.components.engine.replicas) >= 2.0 || double(spec.topology.parameters.numShards) >= 2.0"
                message: "A single shard needs at least 2 replicas"
      componentsOrder:
        - shards
        - replicas

    resources:
      label: "Resources"
      description: "Compute resources and storage per ClickHouse replica."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: quantity
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: "CPU"
                unitLabel: "CPU"
                defaultValue: 2
              validation:
                required: true
                min: 1
            memory:
              uiType: quantity
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 8
                unit: "Gi"
              validation:
                required: true
                min: 2
            disk:
              uiType: quantity
              path: spec.components.engine.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 50
                unit: "Gi"
              validation:
                required: true
                int: true
                min: 10
                modes:
                  edit:
                    celExpressions:
                      # double(): the rule holds whether the value reaches CEL as a
                      # number or as a string ("10").
                      - celExpr: "double(spec.components.engine.storage.size) >= double(original.spec.components.engine.storage.size)"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    keeper:
      label: "ClickHouse Keeper"
      description: "Resources and storage per Keeper node. The replicated topology always runs 3 Keeper nodes."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: quantity
              path: spec.components.keeper.resources.limits.cpu
              fieldParams:
                label: "CPU"
                unitLabel: "CPU"
                defaultValue: 1
              validation:
                required: true
                min: 0.5
            memory:
              uiType: quantity
              path: spec.components.keeper.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 1
                unit: "Gi"
              validation:
                required: true
                min: 1
            disk:
              uiType: quantity
              path: spec.components.keeper.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 10
                unit: "Gi"
              validation:
                required: true
                int: true
                min: 5
                modes:
                  edit:
                    celExpressions:
                      # double(): the rule holds whether the value reaches CEL as a
                      # number or as a string ("10").
                      - celExpr: "double(spec.components.keeper.storage.size) >= double(original.spec.components.keeper.storage.size)"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    advanced:
      label: "Advanced"
      description: "Optional advanced settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            displayEmpty: true
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        storageReclaimPolicy:
          uiType: select
          path: spec.components.engine.parameters.storageReclaimPolicy
          fieldParams:
            label: "Data on deletion"
            helperText: "Whether the ClickHouse and Keeper data volumes are kept or deleted when the instance is deleted or a replica is removed. Kept volumes are re-attached to a new instance with the same name and namespace."
            defaultValue: "Retain"
            options:
              - label: "Keep (Retain)"
                value: "Retain"
              - label: "Delete"
                value: "Delete"
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "TLS"
            helperText: "Encrypt client connections. Requires cert-manager in the cluster."
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"
        tlsMode:
          uiType: select
          path: spec.components.engine.parameters.tls.mode
          fieldParams:
            label: "TLS mode"
            helperText: "Applies with TLS enabled. Required serves clients over TLS only and blocks the plaintext ports to other pods; Optional keeps them open too."
            defaultValue: "required"
            options:
              - label: "Required"
                value: "required"
              - label: "Optional"
                value: "optional"
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "ClickHouse configuration"
            placeholder: |2
              max_concurrent_queries: 200
              logger/level: information
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - storageReclaimPolicy
        - externalAccess
        - tls
        - tlsMode
        - configuration

  sectionsOrder:
    - databaseVersion
    - scaling
    - resources
    - keeper
    - advanced
