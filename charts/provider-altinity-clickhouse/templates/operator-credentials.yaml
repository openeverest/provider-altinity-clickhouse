{{- /*
Credentials the bundled Altinity operator uses to connect to ClickHouse
(replacing the subchart's Secret, which ships a fixed, publicly known
password). The password is taken from operatorCredentials.password when set;
otherwise the existing Secret's password is kept, so upgrades never rotate it
under a running operator; otherwise a random one is generated on install.
*/ -}}
{{- $name := include "provider-altinity-clickhouse.operatorFullname" . -}}
{{- $namespace := default .Release.Namespace .Values.operator.namespaceOverride -}}
{{- $password := "" -}}
{{- if .Values.operatorCredentials.password -}}
{{- $password = .Values.operatorCredentials.password | b64enc -}}
{{- else -}}
{{- $existing := lookup "v1" "Secret" $namespace $name -}}
{{- if and $existing $existing.data (index $existing.data "password") -}}
{{- $password = index $existing.data "password" -}}
{{- else -}}
{{- $password = randAlphaNum 32 | b64enc -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "provider-altinity-clickhouse.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.operatorCredentials.username | b64enc }}
  password: {{ $password }}
