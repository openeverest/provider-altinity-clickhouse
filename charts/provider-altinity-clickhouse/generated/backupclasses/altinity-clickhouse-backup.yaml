apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: altinity-clickhouse-backup
spec:
  description: |
    Backups of ClickHouse Instances made by clickhouse-backup, run by the
    Altinity operator. One replica of each shard is backed up by default, which
    is complete for Replicated* tables.
  displayName: ClickHouse Backup (Altinity)
  executionMode: ProviderManaged
  parametersSchema:
    openAPIV3Schema:
      description: BackupParameters are the parameters of a Backup (spec.parameters).
      properties:
        replicaSelection:
          description: |-
            ReplicaSelection picks the replicas backed up: FirstPerShard (default)
            backs up one replica of each shard, which is complete for Replicated*
            tables; AllReplicas backs up every replica, needed for non-replicated
            tables whose data differs between replicas.
          enum:
            - FirstPerShard
            - AllReplicas
          type: string
      type: object
  providerManaged:
    limits:
      maxStorages: 1
    supportsPITR: false
  restoreParametersSchema:
    openAPIV3Schema:
      description: RestoreParameters are the parameters of a Restore (spec.parameters).
      properties:
        overwrite:
          description: |-
            Overwrite allows restoring over existing tables, which are dropped
            first. Without it a restore into an Instance that already holds the
            backup's tables is refused.
          type: boolean
      type: object
  supportedProviders:
    - altinity-clickhouse
