# Default values for provider-altinity-clickhouse.

# -- Number of replicas for the provider deployment: 1, or 0 to stop it. The
# provider runtime has no leader election yet
# (openeverest/openeverest#3366), so more replicas would reconcile the same
# Instances concurrently; the chart refuses them.
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-altinity-clickhouse-dev
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (health and readiness probes)
  port: 8082

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource.
  # Must match the Go constant ProviderName in internal/common/spec.go
  # so the controller's predicate filter and Provider CR lookup agree.
  name: altinity-clickhouse
  # -- Short provider identifier, used as the prefix of preset names
  # (e.g. 'clickhouse-standalone').
  shortName: clickhouse

# -- ClusterInstancePresets installed with the provider: well-known starting
# points users pick when they create an Instance in any namespace. Each entry
# has a 'name' (prefixed with provider.shortName), 'enabled', and a 'spec' (an
# Instance spec; providerRef is set by the chart). Presets are cluster-scoped,
# so a spec must not reference namespaced objects such as Secrets. version is
# the provider's default version bundle; keep it in step with
# definition/versions.yaml (a unit test checks it).
presets:
  - name: standalone
    enabled: true
    spec:
      version: "26.8"
      topology:
        type: standalone
      components:
        engine:
          type: clickhouse
          replicas: 1
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
          storage:
            size: 25Gi
  - name: replicated
    enabled: true
    spec:
      version: "26.8"
      topology:
        type: replicated
        parameters:
          numShards: 1
      components:
        engine:
          type: clickhouse
          replicas: 2
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
          storage:
            size: 50Gi
        keeper:
          type: clickhouse-keeper
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          storage:
            size: 10Gi

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

admission:
  # -- PEM serving certificate for the Instance admission webhook. Left empty,
  # the chart generates one and keeps it across upgrades.
  certs:
    tls.crt: ""
    tls.key: ""
    ca.crt: ""
  certManager:
    # -- Issue the serving certificate with cert-manager, which must be installed.
    enabled: false

# Before `helm upgrade` applies anything, a hook Job runs the new provider
# image against the live Instances and aborts the upgrade if one would be
# stranded (its engine version removed from the new catalog, or the
# installed release below the new one's minUpgradableFrom).
upgradePreflight:
  # -- Run the upgrade preflight hook
  enabled: true

# The Altinity operator pods, which keep access to the plaintext ClickHouse
# ports when an Instance requires TLS: the operator only connects over plain
# HTTP. Set these when the operator is not the bundled one.
operatorAccess:
  # -- Namespace the operator runs in (defaults to the release namespace)
  namespace: ""
  # -- Label selector (key=value,...) of the operator pods (defaults to the
  # bundled operator's labels)
  podLabels: ""

# Credentials the bundled Altinity operator uses to connect to ClickHouse.
# The chart creates the Secret itself instead of the operator subchart, whose
# default password is fixed and publicly known (operator.secret.create is
# therefore false).
operatorCredentials:
  # -- ClickHouse user the operator connects as
  username: clickhouse_operator
  # -- Password for that user. When empty, the password of an existing Secret
  # is kept, or a random one is generated on first install. Changing it later
  # requires restarting the operator, which reads it at start-up.
  password: ""

# The Altinity ClickHouse operator is bundled as a subchart (alias "operator",
# see Chart.yaml dependencies). CRDs are installed/updated automatically via the
# operator chart's pre-install/pre-upgrade hooks. Additional operator settings
# can be overridden under this "operator:" block, keyed to the
# altinity-clickhouse-operator chart values.
operator:
  # The provider chart owns the credentials Secret (see operatorCredentials).
  secret:
    create: false
  # The provider reconciles Instances in any namespace and applies each
  # ClickHouseInstallation into the Instance's own namespace, so the operator
  # must run cluster-wide. Its ClusterRole-scoped RBAC (rbac.namespaceScoped:
  # false) is on by default; ".*" forces the watch list to all namespaces
  # instead of the upstream own-namespace-only default.
  configs:
    files:
      config.yaml:
        watch:
          namespaces:
            include:
              - ".*"
