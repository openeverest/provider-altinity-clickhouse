---
name: Integration

# Each case runs in its own k3d cluster, in parallel, so a slow or failing
# case neither blocks nor masks the others.

on:
  workflow_dispatch:
    inputs:
      openeverest_version:
        description: >-
          OpenEverest core chart version to install (pre-release tags are not
          picked up by Helm's "latest" resolution, so pin one explicitly).
        required: false
        default: "2.0.0-dev.4"
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  OPENEVEREST_VERSION: ${{ github.event.inputs.openeverest_version || '2.0.0-dev.4' }}

jobs:
  cases:
    name: list cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.list.outputs.cases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: list
        run: |
          echo "cases=$(find test/integration/cases -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  integration:
    name: chainsaw (${{ matrix.case }})
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.cases) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.8.3 bash
          k3d version

      - name: Install Tilt
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh \
            | bash
          tilt version

      - name: Install chainsaw
        run: |
          go install github.com/kyverno/chainsaw@v0.2.15
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The Altinity operator uses inotify heavily; the runner default of
      # fs.inotify.max_user_instances=128 causes silent reconciliation
      # failures on k3d (see README Prerequisites).
      - name: Bump inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288

      # Pod -> Service -> pod traffic on the same k3d node only works when the
      # runner bridges it through iptables (br_netfilter); k3s cannot load the
      # module from inside its container. Without it, replies from a pod on
      # the same node (CoreDNS above all) never reach the client: DNS lookups
      # time out, Keeper misses its liveness deadline resolving its peers on
      # every start, and the ensemble never recovers.
      - name: Enable bridge netfilter
        run: |
          echo "before: $(lsmod | grep -c '^br_netfilter' || true) br_netfilter module(s) loaded"
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1 net.bridge.bridge-nf-call-ip6tables=1

      # Single node: the k3d nodes share the runner's 4 vCPUs anyway.
      - name: Create k3d cluster
        run: make k3d-cluster-up K3D_CONFIG=./dev/k3d_config.ci.yaml

      - name: Check cluster DNS
        run: |
          kubectl -n kube-system rollout status deploy/coredns --timeout=180s
          kubectl run dnscheck --image=debian:stable-slim --restart=Never --command -- sleep 600
          kubectl wait pod/dnscheck --for=condition=Ready --timeout=120s
          kubectl exec dnscheck -- cat /etc/resolv.conf
          # In-cluster and missing names must answer in milliseconds.
          kubectl exec dnscheck -- bash -c '
            for name in kubernetes.default.svc.cluster.local does-not-exist github.com; do
              start=$(date +%s%N)
              getent hosts "$name" >/dev/null && result=found || result="not found"
              echo "$name: $result in $(( ($(date +%s%N) - start) / 1000000 ))ms"
            done'
          kubectl delete pod dnscheck --wait=false

      - name: Bring up OpenEverest core + provider (tilt ci)
        run: tilt ci -f dev/Tiltfile
        env:
          INSTALL_OPENEVEREST: "true"

      - name: Run integration case (chainsaw)
        run: make test-integration INTEGRATION_CASES=test/integration/cases/${{ matrix.case }}

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "===== pods (all namespaces) ====="
          kubectl get pods -A -o wide || true
          echo "===== instances ====="
          kubectl get instances -A -o yaml || true
          echo "===== clickhouseinstallations ====="
          kubectl get clickhouseinstallations -A -o yaml || true
          echo "===== clickhousekeeperinstallations ====="
          kubectl get clickhousekeeperinstallations -A -o yaml || true
          echo "===== provider logs ====="
          kubectl logs -n default -l app.kubernetes.io/name=provider-altinity-clickhouse \
            --tail=300 || true
          echo "===== recent events ====="
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "===== runner load ====="
          uptime || true
          free -m || true
          docker stats --no-stream || true

      - name: Tear down k3d cluster
        if: always()
        run: make k3d-cluster-down K3D_CONFIG=./dev/k3d_config.ci.yaml || true
