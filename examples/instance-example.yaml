# Example Instance CR for the provider-altinity-clickhouse provider.
# Apply this to your cluster to create a database instance.
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. Provider CR applied (provider.yaml)
#   3. Operator running
#   4. Provider controller running
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example-instance
spec:
  providerRef:
    name: altinity-clickhouse
  components:
    engine:
      type: clickhouse
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2G
      storage:
        size: 10Gi
      # Optional: expose ClickHouse via a Service (defaults to ClusterIP).
      # Supported types: ClusterIP, LoadBalancer, NodePort.
      # service:
      #   serviceType: LoadBalancer
      #   annotations:
      #     service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      #   loadBalancerService:
      #     sourceRanges:
      #       - "10.0.0.0/8"
      # Optional: fine-tune ClickHouse server settings (rendered into config.d).
      # parameters:
      #   configuration: |
      #     max_concurrent_queries: 200
      #     logger/level: information
